<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    background:var(--bg); color:var(--ink);
    font-size:14px; line-height:1.5; min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  a{color:var(--primary);}
  .wrap{max-width:1160px;margin:0 auto;padding:20px 16px 64px;}

  /* ---------- Header ---------- */
  header.hero{
    background:linear-gradient(135deg,var(--primary) 0%, var(--primary-dark) 100%);
    color:#fff; border-radius:var(--radius); padding:22px 20px 18px; margin-bottom:16px;
  }
  .hero-top{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap;}
  h1{font-size:19px;font-weight:700;margin:0 0 3px;letter-spacing:-.01em;}
  .subtitle{color:rgba(255,255,255,.78);font-size:12.5px;margin:0;}
  .refresh-btn{
    display:inline-flex;align-items:center;gap:7px;min-height:40px;
    background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.26);color:#fff;
    font:inherit;font-weight:600;font-size:12.5px;padding:9px 15px;border-radius:10px;cursor:pointer;
  }
  .refresh-btn:hover{background:rgba(255,255,255,.22);}
  .refresh-btn.loading .ico{animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  .stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:8px;margin-top:16px;}
  .stat-chip{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);
    border-radius:11px;padding:9px 12px;}
  .stat-chip .num{font-size:20px;font-weight:700;line-height:1.1;}
  .stat-chip .lbl{font-size:10.5px;color:rgba(255,255,255,.78);margin-top:2px;font-weight:500;}
  .stat-chip.warn{background:rgba(192,39,31,.30);border-color:rgba(255,180,175,.45);}

  /* ---------- Alert banner ---------- */
  .banner{
    display:flex;gap:10px;align-items:flex-start;
    background:var(--error-bg);border:1px solid #F3C9C6;color:var(--error-fg);
    border-radius:11px;padding:12px 14px;margin-bottom:14px;font-size:12.5px;line-height:1.5;
  }
  .banner.warn{background:var(--pending-bg);border-color:#EFD9A8;color:var(--pending-fg);}
  .banner b{font-weight:700;}

  /* ---------- View tabs ---------- */
  .tabs{display:flex;gap:6px;margin-bottom:14px;background:var(--card);
    border:1px solid var(--border);border-radius:12px;padding:5px;box-shadow:var(--shadow);}
  .tab{flex:1;min-height:42px;display:flex;align-items:center;justify-content:center;gap:7px;
    border:0;background:transparent;font:inherit;font-size:13px;font-weight:600;color:var(--neutral-dark);
    border-radius:9px;cursor:pointer;padding:0 10px;}
  .tab[aria-selected="true"]{background:var(--primary);color:#fff;}
  .tab .cnt{font-size:11px;font-weight:700;padding:1px 7px;border-radius:20px;
    background:var(--neutral-tint);color:var(--neutral-dark);}
  .tab[aria-selected="true"] .cnt{background:rgba(255,255,255,.22);color:#fff;}

  /* ---------- Controls ---------- */
  .controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px;}
  .search-box{position:relative;flex:1;min-width:190px;}
  .search-box input{width:100%;min-height:44px;padding:11px 14px 11px 38px;border-radius:11px;
    border:1px solid var(--border);background:var(--card);font:inherit;font-size:13.5px;color:var(--ink);
    box-shadow:var(--shadow);outline:none;}
  .search-box input:focus{border-color:var(--primary);}
  .search-box svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);opacity:.42;}
  select{min-height:44px;padding:10px 32px 10px 13px;border-radius:11px;border:1px solid var(--border);
    background:var(--card) url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="10" height="6"><path d="M0 0l5 6 5-6z" fill="%235F6469"/></svg>') no-repeat right 12px center;
    font:inherit;font-size:13px;color:var(--ink);cursor:pointer;box-shadow:var(--shadow);appearance:none;}

  .chip-row{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:16px;}
  .chip{min-height:36px;display:inline-flex;align-items:center;padding:7px 14px;border-radius:20px;
    font-size:12.5px;font-weight:600;background:var(--card);border:1px solid var(--border);
    color:var(--neutral-dark);cursor:pointer;}
  .chip:hover{border-color:var(--primary);color:var(--primary);}
  .chip.active{background:var(--primary);border-color:var(--primary);color:#fff;}

  /* ---------- Badges ---------- */
  .badge{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:700;
    padding:4px 9px;border-radius:7px;letter-spacing:.01em;white-space:nowrap;}
  .b-pending{background:var(--pending-bg);color:var(--pending-fg);}
  .b-done{background:var(--done-bg);color:var(--done-fg);}
  .b-error{background:var(--error-bg);color:var(--error-fg);}
  .b-stale{background:var(--stale-bg);color:var(--stale-fg);}
  .b-info{background:var(--info-bg);color:var(--info-fg);}

  /* ---------- Project cards ---------- */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
    box-shadow:var(--shadow);overflow:hidden;height:fit-content;}
  .card:hover{box-shadow:var(--shadow-lift);}
  .card.unassigned{border-left:3px solid var(--accent);}
  .card-head{padding:15px 15px 12px;cursor:pointer;min-height:44px;}
  .card-title-row{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;}
  .card-title{font-size:15px;font-weight:700;line-height:1.35;margin:0;}
  .chevron{flex-shrink:0;color:var(--neutral);transition:transform .2s;margin-top:3px;}
  .card.expanded .chevron{transform:rotate(180deg);}
  .badge-row{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px;}
  .brief{font-size:12.5px;color:var(--neutral-dark);margin-top:9px;line-height:1.5;white-space:pre-line;}
  .meta-row{display:flex;gap:12px;flex-wrap:wrap;margin-top:10px;font-size:11.5px;color:var(--neutral-dark);}
  .meta-row b{color:var(--ink);font-weight:600;}
  .meta-row .none{color:var(--accent);font-weight:700;}

  .details{display:none;border-top:1px solid var(--border);}
  .card.expanded .details{display:block;}
  .details-inner{padding:14px 15px 15px;display:flex;flex-direction:column;gap:12px;}
  .detail-item{font-size:12.5px;line-height:1.5;}
  .detail-item .k{color:var(--neutral-dark);font-weight:700;display:block;margin-bottom:5px;
    font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;}
  .detail-item .v{white-space:pre-line;}
  .muted{color:var(--neutral);font-style:italic;}

  .link-row{display:flex;gap:7px;flex-wrap:wrap;}
  .link-btn{display:inline-flex;align-items:center;gap:5px;min-height:36px;
    background:var(--primary-tint);color:var(--primary-dark);font-size:11.5px;font-weight:700;
    padding:8px 12px;border-radius:9px;text-decoration:none;}
  .link-btn:hover{background:var(--primary);color:#fff;}
  .link-btn.suggest{background:var(--primary);color:#fff;}
  .link-btn.suggest:hover{background:var(--primary-dark);}

  /* ---------- Item list (shared by both views) ---------- */
  .item-list{display:flex;flex-direction:column;gap:8px;}
  .item{background:var(--card);border:1px solid var(--border);border-left:3px solid var(--neutral-tint);
    border-radius:11px;padding:12px 14px;}
  .item.age-warn{border-left-color:var(--pending);}
  .item.age-bad{border-left-color:var(--accent);}
  .item-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap;}
  .item-title{font-size:13.5px;font-weight:600;line-height:1.4;margin:0;flex:1;min-width:190px;}
  .item-age{font-size:11.5px;color:var(--neutral-dark);white-space:nowrap;font-weight:600;}
  .item-age.old{color:var(--accent);}
  .item-body{font-size:12.5px;color:var(--neutral-dark);margin-top:6px;line-height:1.5;white-space:pre-line;}
  .item-meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px;align-items:center;}
  .item-note{margin-top:8px;padding:8px 10px;background:var(--neutral-tint);border-radius:8px;
    font-size:12px;color:var(--neutral-dark);}
  .proj-tag{font-size:11px;font-weight:700;color:var(--primary-dark);background:var(--primary-tint);
    padding:3px 9px;border-radius:6px;}

  .closed-toggle{background:none;border:1px dashed var(--border);color:var(--neutral-dark);
    font:inherit;font-size:12px;font-weight:600;padding:9px 12px;border-radius:9px;cursor:pointer;
    min-height:40px;width:100%;}
  .closed-toggle:hover{border-color:var(--primary);color:var(--primary);}

  .empty-state{text-align:center;padding:48px 20px;color:var(--neutral-dark);
    background:var(--card);border:1px solid var(--border);border-radius:var(--radius);}
  .empty-state .big{font-size:15px;font-weight:600;color:var(--ink);margin-bottom:6px;}
  .empty-state .small{font-size:12.5px;line-height:1.6;max-width:420px;margin:0 auto;}

  .section-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;
    color:var(--neutral-dark);margin:20px 0 9px;}

  footer{text-align:center;color:var(--neutral);font-size:11.5px;margin-top:32px;line-height:1.7;}
  footer .stale{color:var(--accent);font-weight:600;}

  @media (max-width:600px){
    .wrap{padding:14px 12px 56px;}
    .grid{grid-template-columns:1fr;}
    h1{font-size:17px;}
    header.hero{padding:18px 16px 15px;}
    .stat-row{grid-template-columns:repeat(2,1fr);}
    .tab{font-size:12.5px;}
  }

  /* Automated runs — read-only list. Status colour is never the only signal:
     every pill carries its word, and the card keeps its own left rule. */
  .run{background:var(--surface,#fff);border:1px solid var(--line,#e3e6ea);
       border-left:3px solid var(--neutral-dark,#8b9099);border-radius:8px;
       padding:12px 14px;margin-bottom:10px;}
  .run.ok{border-left-color:#1b8a3f;} .run.pend{border-left-color:#c98a00;}
  .run.err{border-left-color:#c62828;} .run.stale{border-left-color:#8b9099;}
  .run-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:4px;}
  .run-proj{font-weight:650;color:var(--ink);font-size:13.5px;}
  .run-meta{font-size:12px;color:var(--neutral-dark);margin-bottom:8px;}
  .run-meta a{color:inherit;}
  .run-body{font-size:12.5px;line-height:1.6;margin:0 0 8px;white-space:pre-wrap;}
  .run-note{font-size:12px;color:var(--neutral-dark);margin:8px 0 0;
            padding-top:8px;border-top:1px dashed var(--line,#e3e6ea);}
  .run-unver summary{font-size:12px;font-weight:600;cursor:pointer;
                     color:#8a5a00;padding:4px 0;min-height:44px;
                     display:flex;align-items:center;}
  .run-unver p{font-size:12px;line-height:1.6;white-space:pre-wrap;
               background:#fdf7e8;border-radius:6px;padding:10px;margin:0 0 4px;}
  .pill{font-size:11px;font-weight:650;padding:3px 9px;border-radius:999px;
        border:1px solid transparent;white-space:nowrap;}
  .pill.ok{background:#d7efdc;color:#0b5c26;border-color:#a9d9b8;}
  .pill.pend{background:#fdf0d0;color:#7a4f01;border-color:#e8cf95;}
  .pill.err{background:#fbdcdc;color:#8c1c1c;border-color:#efb7b7;}
  .pill.stale{background:#ebedf0;color:#4a4f57;border-color:#d4d8de;}
  @media (max-width:420px){ .run{padding:11px 12px;} }
</style>
