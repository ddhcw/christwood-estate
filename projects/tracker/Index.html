<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body>
<div class="wrap">

  <header class="hero">
    <div class="hero-top">
      <div>
        <h1>🧩 <?= appTitle ?></h1>
        <p class="subtitle" id="freshness">Loading…</p>
      </div>
      <button class="refresh-btn" id="refreshBtn" onclick="refreshData()" aria-label="Refresh">
        <svg class="ico" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/></svg>
        Refresh
      </button>
    </div>
    <div class="stat-row" id="statRow"></div>
  </header>

  <div id="banners"></div>

  <div class="tabs" role="tablist">
    <button class="tab" id="tab-items" role="tab" onclick="setView('items')">
      Open items <span class="cnt" id="cnt-items">0</span>
    </button>
    <button class="tab" id="tab-projects" role="tab" onclick="setView('projects')">
      Projects <span class="cnt" id="cnt-projects">0</span>
    </button>
    <button class="tab" id="tab-runs" role="tab" onclick="setView('runs')">
      Automated runs <span class="cnt" id="cnt-runs">0</span>
    </button>
  </div>

  <div class="controls">
    <div class="search-box">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="7"/><path d="m20 20-3-3"/></svg>
      <input id="searchInput" type="text" placeholder="Search…" oninput="render()" autocomplete="off">
    </div>
    <select id="groupSelect" onchange="render()"><option value="">All groups</option></select>
    <select id="ownerSelect" onchange="render()"><option value="">Anyone</option></select>
  </div>

  <div class="chip-row" id="filterChips"></div>

  <div id="viewRuns" style="display:none"></div>

  <div id="viewProjects" style="display:none">
    <div class="grid" id="cardGrid"></div>
  </div>

  <div id="viewItems">
    <div class="item-list" id="itemList"></div>
  </div>

  <div id="emptyState"></div>

  <footer id="footer"></footer>
</div>

<script id="tracker-data" type="application/json"><?!= dataJson ?></script>
<?!= include('ui/Scripts') ?>

</html>
