<div class="card" id="form-maint">
  <h2>🔧 Add maintenance</h2>
  <p class="muted" style="margin-top:-6px">This entry is also your approval note — fill the approval reference if you have one.</p>

  <div class="field">
    <label class="req">Vehicle</label>
    <select class="js-vehicle" data-field="vehicle_id" onchange="onVehicleChange('maint')"></select>
    <div class="hint" id="odoHint-maint"></div>
  </div>
  <div id="orNudge-maint"></div>

  <div class="two">
    <div class="field">
      <label class="req">Date</label>
      <input type="date" class="js-today" data-field="date">
    </div>
    <div class="field js-odo-field">
      <label class="req js-odo-label">Odometer (km)</label>
      <input type="number" inputmode="numeric" data-field="odometer" placeholder="e.g. 84210">
    </div>
  </div>
  <button type="button" class="linkbtn js-odo-toggle" onclick="odoToggle('maint')">Odometer not working?</button>

  <div class="field">
    <label>Category</label>
    <select class="js-choice" data-choice="category" data-field="category"></select>
  </div>

  <div class="field" id="offRoadField">
    <div class="switch amber">
      <label>Take this vehicle off road?</label>
      <span class="sw">
        <input type="checkbox" id="maint-offroad" data-field="off_road" data-type="bool" data-default="off">
        <span class="track" onclick="document.getElementById('maint-offroad').click()"></span>
      </span>
    </div>
    <div class="hint" id="offRoadHint">Marks it <b>Under maintenance</b>. Tap it back on road from the home
      screen when it returns, and the days off road land on this entry by themselves.</div>
  </div>

  <div class="field">
    <label class="req">What was done</label>
    <textarea data-field="description" placeholder="e.g. front brake pads replaced"></textarea>
  </div>

  <div class="two">
    <div class="field">
      <label>Parts</label>
      <input type="number" step="0.01" inputmode="decimal" data-field="parts" placeholder="₹">
    </div>
    <div class="field">
      <label>Labour</label>
      <input type="number" step="0.01" inputmode="decimal" data-field="labour" placeholder="₹">
    </div>
  </div>

  <div class="two">
    <div class="field">
      <label>Vendor / garage</label>
      <input type="text" data-field="vendor" placeholder="optional">
    </div>
    <div class="field">
      <label>Approval ref</label>
      <input type="text" data-field="approval_ref" placeholder="optional">
    </div>
  </div>

  <div class="two">
    <div class="field">
      <label>Days off road</label>
      <input type="number" inputmode="numeric" data-field="downtime_days" placeholder="0">
    </div>
    <div class="field">
      <label>Entered by</label>
      <select class="js-staff" data-field="entered_by"></select>
    </div>
  </div>

  <button class="btn" id="savebtn-maint" onclick="saveMaint()">Save maintenance</button>
  <div class="editbar" id="editbar-maint">
    <button class="btn danger" id="voidbtn-maint" onclick="voidCurrent('maint')">Void this entry</button>
  </div>
</div>
