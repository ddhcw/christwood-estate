<div class="card" id="form-fuel">
  <h2>⛽ Add a fuel fill</h2>

  <div class="field">
    <label class="req">Vehicle</label>
    <select class="js-vehicle" data-field="vehicle_id" onchange="onVehicleChange('fuel')"></select>
    <div class="hint" id="odoHint-fuel"></div>
  </div>
  <div id="orNudge-fuel"></div>

  <div class="two">
    <div class="field">
      <label class="req">Date</label>
      <input type="date" class="js-today" data-field="date">
    </div>
    <div class="field js-odo-field">
      <label class="req js-odo-label">Odometer (km)</label>
      <input type="number" inputmode="numeric" data-field="odometer" placeholder="e.g. 84210">
    </div>
  </div>
  <button type="button" class="linkbtn js-odo-toggle" onclick="odoToggle('fuel')">Odometer not working?</button>

  <div class="two">
    <div class="field">
      <label>Bill no.</label>
      <input type="text" inputmode="numeric" data-field="bill_no" placeholder="e.g. 18690">
      <div class="hint" id="billHint"></div>
    </div>
    <div class="field">
      <label>Product</label>
      <select class="js-choice" data-choice="product" data-field="product" onchange="onProductChange()"></select>
    </div>
  </div>

  <div class="two">
    <div class="field">
      <label class="req">Amount</label>
      <input type="number" step="0.01" inputmode="decimal" data-field="amount" placeholder="total ₹" oninput="autoLitres()">
    </div>
    <div class="field">
      <label>Litres</label>
      <input type="number" step="0.01" inputmode="decimal" data-field="litres" placeholder="e.g. 42.5" oninput="litresTouched(this)">
    </div>
  </div>
  <div class="hint" id="litresHint"></div>
  <div class="hint" id="productHint"></div>

  <div class="field">
    <div class="switch">
      <label>Filled to a full tank?</label>
      <span class="sw">
        <input type="checkbox" id="fuel-full" data-field="filled_to_full" data-type="bool" checked>
        <span class="track" onclick="document.getElementById('fuel-full').click()"></span>
      </span>
    </div>
    <div class="hint">Tick when you fill right up — it keeps the km/L figure accurate.</div>
  </div>

  <div class="two">
    <div class="field">
      <label>Paid by</label>
      <select class="js-choice" data-choice="paid_by" data-field="paid_by"></select>
    </div>
    <div class="field">
      <label>Station</label>
      <input type="text" data-field="station" placeholder="optional">
    </div>
  </div>

  <div class="two">
    <div class="field">
      <label>Driver</label>
      <select class="js-driver" data-field="driver_id"></select>
    </div>
    <div class="field">
      <label>Entered by</label>
      <select class="js-staff" data-field="entered_by"></select>
    </div>
  </div>

  <button class="btn" id="savebtn-fuel" onclick="saveFuel()">Save fuel entry</button>
  <div class="editbar" id="editbar-fuel">
    <button class="btn danger" id="voidbtn-fuel" onclick="voidCurrent('fuel')">Void this entry</button>
  </div>
</div>
