<style>
  :root{
    --bg:#FBFAFF; --card:#FFFFFF;
    --lav:#E8E1F5; --lav-deep:#C9B8EE; --lav-text:#4A3F6B;
    --mint:#DDF3E4; --peach:#FCE8DA; --sky:#DDEBF7; --pink:#FCE4EC; --butter:#FCF3D6;
    --text:#3F3A52; --muted:#8A8398; --line:#ECE8F3;
    --good:#3FA776; --warn:#C9892B; --bad:#C85B5B;
    --radius:18px; --shadow:0 6px 20px rgba(120,100,170,.10);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;}
  .wrap{max-width:560px;margin:0 auto;padding:0 16px 96px;}

  /* App bar */
  .bar{position:sticky;top:0;z-index:10;background:var(--bg);
    display:flex;align-items:center;gap:10px;padding:16px 0 10px;}
  .bar h1{font-size:18px;margin:0;font-weight:700;}
  .bar .sub{font-size:12px;color:var(--muted);margin-top:2px;}
  .back{border:none;background:var(--lav);color:var(--lav-text);width:38px;height:38px;
    border-radius:12px;font-size:18px;cursor:pointer;flex:0 0 auto;display:none;}
  .back:active{transform:scale(.96)}

  /* Home grid */
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:6px;}
  .tile{border:none;border-radius:var(--radius);padding:20px 16px;text-align:left;cursor:pointer;
    box-shadow:var(--shadow);color:var(--lav-text);min-height:104px;display:flex;flex-direction:column;
    justify-content:space-between;transition:transform .08s ease;}
  .tile:active{transform:scale(.97)}
  .tile .ic{font-size:30px}
  .tile .lb{font-weight:700;font-size:15px}
  .t-peach{background:var(--peach)} .t-sky{background:var(--sky)} .t-mint{background:var(--mint)}
  .t-butter{background:var(--butter)} .t-lav{background:var(--lav)} .t-pink{background:var(--pink)}

  /* Cards & forms */
  .card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);
    padding:18px;margin-bottom:16px;}
  .card h2{margin:0 0 12px;font-size:16px;color:var(--lav-text);}
  .field{margin-bottom:14px;}
  label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:6px;}
  .req:after{content:" *";color:var(--bad)}
  input,select,textarea{width:100%;padding:12px 13px;border:1.5px solid var(--line);border-radius:12px;
    font-size:16px;background:#fff;color:var(--text);outline:none;font-family:inherit;}
  input:focus,select:focus,textarea:focus{border-color:var(--lav-deep);box-shadow:0 0 0 3px rgba(201,184,238,.35)}
  textarea{min-height:76px;resize:vertical}
  .hint{font-size:12px;color:var(--muted);margin-top:6px;min-height:14px;}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:12px;}

  /* Toggle switch */
  .switch{display:flex;align-items:center;justify-content:space-between;background:var(--mint);
    padding:12px 14px;border-radius:12px;}
  .switch label{margin:0;color:var(--lav-text);font-weight:700}
  .sw{position:relative;width:52px;height:30px;flex:0 0 auto}
  .sw input{opacity:0;width:0;height:0;position:absolute}
  .sw .track{position:absolute;inset:0;background:#cfe9d8;border-radius:20px;transition:.2s;cursor:pointer}
  .sw .track:before{content:"";position:absolute;height:24px;width:24px;left:3px;top:3px;background:#fff;
    border-radius:50%;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
  .sw input:checked + .track{background:var(--good)}
  .sw input:checked + .track:before{transform:translateX(22px)}

  /* Buttons */
  .btn{width:100%;border:none;border-radius:14px;padding:15px;font-size:16px;font-weight:700;cursor:pointer;
    background:linear-gradient(135deg,#C9B8EE,#B7A6E0);color:#fff;box-shadow:var(--shadow);}
  .btn:active{transform:scale(.98)}
  .btn.ghost{background:var(--lav);color:var(--lav-text);box-shadow:none}

  /* Dashboard */
  .kpis{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:4px}
  .kpi{border-radius:var(--radius);padding:14px;box-shadow:var(--shadow)}
  .kpi .v{font-size:24px;font-weight:800}
  .kpi .k{font-size:12px;color:var(--muted);font-weight:600}
  .barrow{display:flex;align-items:center;gap:10px;margin:8px 0}
  .barrow .nm{width:96px;font-size:13px;font-weight:600;flex:0 0 auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bartrack{flex:1;background:var(--line);border-radius:10px;height:18px;overflow:hidden}
  .barfill{height:100%;background:linear-gradient(90deg,#C9B8EE,#9FD9B8);border-radius:10px}
  .barval{width:64px;text-align:right;font-size:13px;font-weight:700;flex:0 0 auto}
  .watch{border-left:5px solid var(--bad);background:#FCEFEF;border-radius:12px;padding:12px;margin-bottom:10px}
  .watch .r{font-weight:700;color:var(--lav-text)}
  .watch .why{font-size:13px;color:var(--text);margin-top:2px}
  .chip{display:inline-block;font-size:12px;background:#fff;border:1px solid var(--line);border-radius:20px;
    padding:3px 10px;margin:4px 4px 0 0}
  .doc{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-radius:12px;margin-bottom:8px}
  .doc.amber{background:var(--butter)} .doc.red{background:#FAD9D9}
  .doc .d{font-size:12px;color:var(--muted)}
  .empty{background:var(--mint);border-radius:12px;padding:14px;color:var(--lav-text);font-weight:600}
  .muted{color:var(--muted);font-size:13px}

  /* Toast */
  #toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(120px);
    background:#fff;border-radius:14px;box-shadow:0 8px 28px rgba(80,60,120,.25);padding:14px 18px;
    font-weight:600;max-width:90%;transition:transform .25s ease;z-index:50;border-left:6px solid var(--good)}
  #toast.show{transform:translateX(-50%) translateY(0)}
  #toast.err{border-left-color:var(--bad)}

  .view{display:none} .view.active{display:block}
  .loading{text-align:center;color:var(--muted);padding:30px}

  /* Admin lock + gating */
  .lock{border:none;background:var(--lav);color:var(--lav-text);width:40px;height:40px;border-radius:12px;
    font-size:18px;cursor:pointer;flex:0 0 auto}
  .lock:active{transform:scale(.96)}
  .lock.on{background:var(--good);color:#fff}
  .admin-only{display:none !important}
  body.is-admin .admin-only{display:flex !important}

  /* Lists */
  .listhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:10px}
  .btn.small{width:auto;padding:9px 16px;font-size:14px;border-radius:12px}
  .btn.danger{background:linear-gradient(135deg,#F0B4B4,#E29A9A);color:#5a1f1f}
  input[type=search]{margin-bottom:12px}
  .listrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 14px;
    border:1.5px solid var(--line);border-radius:12px;margin-bottom:8px;cursor:pointer;background:#fff}
  .listrow:active{transform:scale(.99)}
  .listrow .main{min-width:0}
  .listrow .ttl{font-weight:700;color:var(--lav-text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .listrow .meta{font-size:12px;color:var(--muted);margin-top:2px}
  .listrow .go{color:var(--muted);flex:0 0 auto}
  .pill{font-size:11px;border-radius:20px;padding:3px 9px;font-weight:700;flex:0 0 auto}
  .pill.active{background:var(--mint);color:#1f6b48}
  .pill.retired{background:var(--line);color:var(--muted)}
  .pill.void{background:#FAD9D9;color:#7a2a2a}

  /* Segmented control */
  .seg{display:flex;background:var(--lav);border-radius:14px;padding:4px;gap:4px}
  .seg-btn{flex:1;border:none;background:transparent;color:var(--lav-text);padding:9px 6px;border-radius:10px;
    font-size:13px;font-weight:700;cursor:pointer}
  .seg-btn.active{background:#fff;box-shadow:var(--shadow)}

  /* Edit/void bar inside a form */
  .editbar{display:none;margin-top:10px}
  .editbar.show{display:block}

  /* Offline queue banner */
  .qbanner{background:var(--butter);border:1.5px solid #F0DFA8;border-radius:14px;padding:13px 15px;
    margin-bottom:14px;font-weight:700;color:#6b5312;cursor:pointer}
  .qbanner:active{transform:scale(.99)}

  /* Vehicle-state banner (off road / odometer out of action) */
  .sbanner{background:var(--butter);border:1.5px solid #F0DFA8;border-radius:14px;
    padding:12px 14px;margin-bottom:14px;color:#6b5312}
  .sbanner .sttl{font-weight:800;font-size:13px;margin-bottom:8px}
  .srow{display:flex;align-items:center;justify-content:space-between;gap:10px;
    background:#fff;border-radius:11px;padding:9px 11px;margin-top:6px}
  .srow .snm{font-weight:700;font-size:14px;color:var(--text);min-width:0;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .srow .ssub{font-size:12px;color:var(--muted);font-weight:600}
  .srow .btn.small{flex:0 0 auto}

  /* Inline "link" button inside a form */
  .linkbtn{background:none;border:none;padding:2px 0 10px;font-size:13px;font-weight:700;
    color:var(--lav-text);text-decoration:underline;cursor:pointer;font-family:inherit}
  .linkbtn:active{opacity:.6}

  /* Confirm sheet */
  .dlgwrap{display:none;position:fixed;inset:0;background:rgba(63,58,82,.45);z-index:60;
    align-items:flex-end;justify-content:center;padding:16px}
  .dlgwrap.show{display:flex}
  .dlg{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);
    padding:18px;width:100%;max-width:520px;max-height:88vh;overflow:auto}
  .dlg h2{margin:0 0 10px;font-size:17px;color:var(--lav-text)}
  @media (min-width:560px){ .dlgwrap{align-items:center} }

  /* Amber variant of the toggle row — for "take this off road" */
  .switch.amber{background:var(--butter)}
  .switch.amber .track{background:#EBD9A6}
  .switch.amber input:checked + .track{background:var(--warn)}

  .pill.offroad{background:var(--butter);color:#6b5312}
  .pill.noodo{background:var(--pink);color:#7a2a4a}

  /* Attendance — marking a day */
  .attsum{margin:6px 0 10px;min-height:26px}
  .attrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 11px;
    border:1.5px solid var(--line);border-radius:12px;margin-bottom:7px;background:#fff}
  .attwho{min-width:0;flex:1}
  .attwho .ttl{font-weight:700;color:var(--lav-text);font-size:14px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .attwho .meta{font-size:11px;color:var(--muted);margin-top:1px}
  .attcodes{display:flex;gap:5px;flex:0 0 auto}
  .attbtn{width:38px;height:38px;border-radius:11px;border:1.5px solid var(--line);background:#fff;
    font-weight:800;font-size:14px;color:var(--muted);cursor:pointer;font-family:inherit}
  .attbtn:active{transform:scale(.94)}
  .attbtn.on{border-color:transparent;color:#fff}
  .attbtn.on.c-P{background:var(--good)} .attbtn.on.c-L{background:var(--bad)}
  .attbtn.on.c-H{background:var(--warn)} .attbtn.on.c-O{background:#8A8398}
  .chip.c-P{background:var(--mint);border-color:#bfe5cf} .chip.c-L{background:#FAD9D9;border-color:#f0c0c0}
  .chip.c-H{background:var(--butter);border-color:#EBD9A6} .chip.c-O{background:var(--line)}

  /* Attendance — month grid */
  .gridwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1.5px solid var(--line);border-radius:12px}
  table.agrid{border-collapse:collapse;font-size:11px;white-space:nowrap}
  table.agrid th,table.agrid td{border:1px solid var(--line);padding:3px 4px;text-align:center;min-width:22px}
  table.agrid thead th{background:var(--lav);color:var(--lav-text);font-size:11px;position:sticky;top:0}
  table.agrid th.stick{position:sticky;left:0;z-index:2;background:#fff;text-align:left;
    min-width:130px;max-width:130px}
  table.agrid thead th.stick{background:var(--lav);z-index:3}
  table.agrid th.stick .ttl{font-weight:700;color:var(--lav-text);overflow:hidden;text-overflow:ellipsis;max-width:124px}
  table.agrid th.stick .meta{font-size:10px;color:var(--muted);font-weight:400}
  table.agrid .dw{font-size:9px;color:var(--muted);font-weight:400}
  table.agrid td.off,table.agrid th.off{background:#F4F2F8}
  table.agrid td.c-P{background:var(--mint)} table.agrid td.c-L{background:#FAD9D9}
  table.agrid td.c-H{background:var(--butter)} table.agrid td.c-O{background:var(--line)}
  table.agrid td.tot{font-weight:700;background:#FBFAFF}
  table.agrid tr.tally th,table.agrid tr.tally td{background:#F7F4FB;font-weight:700}

  /* Report preview */
  .rptprev{background:var(--sky);border-radius:12px;padding:12px 14px;margin-bottom:12px;
    color:var(--text);font-size:13px;line-height:1.55}

  /* QR codes */
  .qrgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .qrcard{border:1.5px solid var(--line);border-radius:14px;padding:14px;text-align:center;background:#fff}
  .qrcard img{width:150px;height:150px}
  .qrcard .ttl{font-weight:800;color:var(--lav-text);margin-top:8px;font-size:15px}
  @media print{
    .bar,.btn,.back,.lock,input[type=search],#adminHint,.muted{display:none !important}
    .card{box-shadow:none;border:none}
    .qrcard{break-inside:avoid}
  }
</style>
